<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Record shops · Wax & Know</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Serif+Display:ital@0;1&family=Karla:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F5EDD8;
      --cream-dark: #EDE0C4;
      --cream-darker: #E0D0A8;
      --brown-deep: #2C1A0E;
      --brown-mid: #5C3A1E;
      --brown-light: #8B5E3C;
      --amber: #C8822A;
      --amber-light: #E8A84A;
      --red-label: #B03A2E;
      --green-label: #2E6B4F;
      --groove: #1A0F06;
      --ink: #1E120A;
    }

    body {
      background-color: var(--cream);
      color: var(--brown-deep);
      font-family: 'Karla', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Grain texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 1000;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 4rem;
      border-bottom: 1px solid var(--cream-darker);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 1.5rem;
      color: var(--brown-deep);
      letter-spacing: -0.02em;
    }

    .logo span {
      color: var(--amber);
    }

    /* ── PLACEHOLDER ── */
    main {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 6rem 2rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.5rem, 4vw, 4rem);
      line-height: 1.1;
      color: var(--brown-deep);
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    main p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--brown-mid);
    }

    /* ── FOOTER ── */
    footer {
      padding: 2rem 4rem;
      border-top: 1px solid var(--cream-darker);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-logo {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 1rem;
      color: var(--brown-deep);
    }

    .footer-logo span { color: var(--amber); }

    .footer-links {
      display: flex;
      gap: 2rem;
    }

    .footer-links a {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--brown-light);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover { color: var(--amber); }

    .footer-copy {
      font-size: 0.72rem;
      color: var(--brown-light);
      letter-spacing: 0.04em;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      header { padding: 1.5rem 2rem; }
      main { padding: 4rem 2rem; }
      footer { padding: 2rem; flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Wax <span>&</span> Know</div>
  </header>

  <main>
    <h1>Record shops</h1>
    <p>Content coming soon.</p>
  </main>

  <footer>
    <div class="footer-logo">Wax <span>&</span> Know</div>
    <div class="footer-links">
      <a href="mailto:hello@waxandknow.com">hello@waxandknow.com</a>
    </div>
    <div class="footer-copy">© 2026 Wax & Know. All rights reserved.</div>
  </footer>

</body>
</html>
